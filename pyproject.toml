[project]
name = "ru-ab-nllb-training"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.3.0",
    "transformers>=4.44.0",
    "accelerate>=0.33.0",
    "datasets>=2.20.0",
    "evaluate>=0.4.2",
    "sacrebleu>=2.4.3",
    "sentencepiece>=0.2.0",
    "protobuf>=4.25.3",
    "huggingface_hub>=0.24.0",
    "peft>=0.12.0",
    "ipywidgets>=8.1.3",
    "jupyterlab>=4.2.0",
    "pandas>=2.2.0",
    "pyarrow>=16.1.0",
]

[project.optional-dependencies]
cuda = ["bitsandbytes>=0.43.3"]

[tool.uv]
package = false
